<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aron projektek</title>
<meta name="robots" content="noindex">
<style>
  :root { --bg:#f7f6f3; --fg:#1b1b1b; --muted:#6b6b6b; --line:#e2e0da; --accent:#1b1b1b; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#f0efec; --muted:#9a9a9a; --line:#2a2a2a; --accent:#f0efec; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width:720px; margin:0 auto; padding:64px 16px; }
  h1 { font-size:32px; letter-spacing:-0.02em; margin:0 0 8px; }
  p { color:var(--muted); margin:0 0 40px; }
  ul { list-style:none; padding:0; margin:0; border-top:1px solid var(--line); }
  li a { display:flex; justify-content:space-between; gap:16px; padding:18px 0; border-bottom:1px solid var(--line); color:var(--fg); text-decoration:none; }
  li a:hover span:first-child { text-decoration:underline; }
  li a span:last-child { color:var(--muted); white-space:nowrap; }
</style>
</head>
<body>
<main>
  <h1>Aron projektek</h1>
  <p>Weboldal-tervek és prototípusok.</p>
  <ul>
    <li><a href="barbarians-boxing/"><span>Barbarians Boxing</span><span>weboldal →</span></a></li>
  </ul>
</main>
</body>
</html>
